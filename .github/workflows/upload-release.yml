name: Upload release builds

# Attach the ISO and PS5 image from finished "Build ISO" and
# "Build PS5 image" runs to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      iso_run:
        description: Build ISO run id
        required: true
      ps5_run:
        description: Build PS5 image run id
        required: true
  push:
    branches: [claude/project-thread-g7qojb]

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/ci/upload-release.sh \
            "${{ inputs.tag || 'v0.3' }}" \
            "${{ inputs.iso_run || '40078214433' }}" \
            "${{ inputs.ps5_run || '39912052204' }}"
