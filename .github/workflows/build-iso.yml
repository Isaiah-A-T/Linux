name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["iso/**", "session/**", "shell/**", "installer/**", "Makefile", ".github/**"]
  pull_request:
    paths: ["iso/**", "session/**", "shell/**", "installer/**", "Makefile", ".github/**"]

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test

  iso:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write  # publish the [lumen] pacman repo release
    steps:
      # The ISO pulls in Steam, Chromium, Wine and Calamares; the stock runner
      # needs room for the package cache, the root filesystem and the image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Build in an Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            archlinux:latest bash /src/.github/ci/build-iso.sh /src

      - name: Checksum
        run: |
          cd out
          sudo chown -R "$USER" .
          sha256sum *.iso | tee SHA256SUMS
          ls -lh

      # Installed systems update the shell from this repo (Settings › System update).
      - name: Publish the pacman repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/ci/publish-repo.sh out/repo lumen-repo

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

  # Boot the ISO in QEMU and screenshot what a player sees. Screenshots go to
  # the run's artifacts and to the vm-screenshots branch.
  vm:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lumen-iso
          path: out

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 libarchive-tools socat
          # Let the runner user use KVM when the host offers it.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Boot and take screenshots
        run: .github/ci/vm-screenshots.sh out/*.iso vm-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-screenshots
          path: vm-screenshots

      - name: Publish to the vm-screenshots branch
        if: always()
        run: |
          cd vm-screenshots
          git init -q -b vm-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "VM screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vm-screenshots
