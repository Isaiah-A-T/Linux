name: UI screenshots

on:
  workflow_dispatch:
  pull_request:
    paths: ["shell/**", ".github/ci/ui-screenshots.js", ".github/workflows/ui-screenshots.yml"]

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium for Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      # Mock data, but the game art is fetched from Steam for real.
      - name: Take screenshots
        run: |
          export XDG_DATA_HOME=$RUNNER_TEMP/data XDG_CACHE_HOME=$RUNNER_TEMP/cache
          LUMEN_MOCK=1 PYTHONPATH=shell python3 -m lumend --ui shell/ui > $RUNNER_TEMP/lumend.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:7777/api/ping && break; sleep 1; done
          mkdir -p ui-screenshots
          NODE_PATH=/tmp/pw/node_modules node .github/ci/ui-screenshots.js ui-screenshots
          cat $RUNNER_TEMP/lumend.log

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots

      - name: Publish to the ui-screenshots branch
        run: |
          cd ui-screenshots
          git init -q -b ui-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "UI screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-screenshots
