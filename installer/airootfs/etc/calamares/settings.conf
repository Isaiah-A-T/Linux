# Lumen OS installer: Calamares main configuration.
#
# Installs the live system's own root filesystem (an offline install, no
# network needed), then turns it from a live image into an installed
# Lumen OS: removes the live user and archiso tweaks, writes the greetd
# login config and enables services. See installer/README.md.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       lumen-target
  module:   shellprocess
  config:   shellprocess-lumen-target.conf
- id:       lumen-avatar
  module:   shellprocess
  config:   shellprocess-lumen-avatar.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - luksbootkeyfile
  - initcpiocfg
  - shellprocess@lumen-target
  - removeuser
  - usersq
  - shellprocess@lumen-avatar
  - networkcfg
  - hwclock
  - services-systemd
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finishedq

branding: lumen

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
