---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        300MiB
    label:              "EFI"

# Swap file instead of a partition keeps "Erase disk" to two partitions.
userSwapChoices:
    - none
    - file
initialSwapChoice: file

# Most console installs take over the whole drive; preselect that and
# keep alongside/replace/manual available.
initialPartitioningChoice: erase
defaultFileSystemType:  "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

luksGeneration: luks2
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true
