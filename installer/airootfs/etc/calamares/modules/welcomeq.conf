---
qmlSearch: both
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    24
    requiredRam:        2.0
    internetCheckUrl:   https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
    # Offline install: only disk, memory and root are hard requirements.
    required:
        - storage
        - ram
        - root

geoip:
    style:    "none"
