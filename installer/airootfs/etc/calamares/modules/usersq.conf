---
qmlSearch: both
# Groups the shell needs: wheel for admin, video/input for gamescope and
# controllers, audio for sound.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - video
    - input
    - audio
    - storage
    - network
sudoersGroup:    wheel
sudoersConfigureWithGroup: true
autologinGroup:  autologin
doAutologin:     false
displayAutologin: false
# Root stays locked; the first profile administers the console via sudo.
setRootPassword: false
doReusePassword: true
# Console-friendly: a 4-digit PIN is allowed, with a warning.
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, player, greeter ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-lumen"
  forbidden_names: [ localhost ]
