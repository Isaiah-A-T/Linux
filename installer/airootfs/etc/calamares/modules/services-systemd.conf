---
# greetd provides display-manager.service; the shell's own daemon
# (lumend) is a user unit started by lumen-session.
units:
    - name: "greetd"
      mandatory: true
    - name: "NetworkManager"
      mandatory: true
    - name: "bluetooth"
      mandatory: false
    - name: "snapd.socket"
      mandatory: false
    - name: "systemd-timesyncd"
      mandatory: false
    - name: "fstrim.timer"
      mandatory: false
