# Sourced by lumen-session on the PS5 image.
#
# The PS5's HDMI port sits behind an internal DP->HDMI bridge that shows up
# as DP-1. The bridge can't pass BT.2020 signalling, so keep SDR at sRGB
# (see also /etc/gamescope/scripts/90-ps5-srgb.lua).
export LUMEN_GAMESCOPE_ARGS="${LUMEN_GAMESCOPE_ARGS:---backend drm --prefer-output DP-1 --sdr-gamut-wideness 0}"
# gamescope takes the GPU and input devices through logind.
export LIBSEAT_BACKEND=logind
# No HID devices may be attached when the session starts.
export WLR_LIBINPUT_NO_DEVICES=1
# Sourced by lumen-greeter too: show the sign-in screen through gamescope
# with the settings above. Under cage it stayed black on the PS5.
export LUMEN_GREETER_GAMESCOPE=1
