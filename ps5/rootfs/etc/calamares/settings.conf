# Lumen OS setup on the PS5 USB image.
#
# Unlike the ISO there is nothing to install: Linux already runs from the
# USB drive the ps5-linux loader boots. Setup configures this running
# system (dont-chroot) with the same pages minus the disk step, then
# switches the console to the sign-in screen. See ps5/README.md.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       lumen-avatar
  module:   shellprocess
  config:   shellprocess-lumen-avatar.conf
- id:       lumen-ps5-done
  module:   shellprocess
  config:   shellprocess-lumen-ps5-done.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - usersq
  - summaryq
- exec:
  - lumenroot
  - localeq
  - keyboardq
  - localecfg
  - usersq
  - shellprocess@lumen-avatar
  - shellprocess@lumen-ps5-done
- show:
  - finishedq

branding: lumen

prompt-install: false
dont-chroot: true
oem-setup: true
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
