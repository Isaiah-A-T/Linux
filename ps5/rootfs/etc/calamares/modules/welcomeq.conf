---
qmlSearch: both
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

# Nothing is written to a disk, so only root is a hard requirement.
requirements:
    requiredRam:        2.0
    internetCheckUrl:   https://archlinux.org
    check:
        - ram
        - internet
        - root
    required:
        - root

geoip:
    style:    "none"
