# pacman.conf for the PS5 image, written from scratch so the build host's
# settings (the archlinux container's NoExtract rules drop locales, man
# pages and more) don't leak into the image. ps5/build.sh installs with it
# and copies it to /etc/pacman.conf.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Steam and 32-bit Vulkan
[multilib]
Include = /etc/pacman.d/mirrorlist
